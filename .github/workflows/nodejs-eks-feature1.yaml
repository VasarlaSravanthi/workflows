name: nodejs eks feature1
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
env:
  project: "${{ inputs.project }}"
  component: "${{ inputs.component }}"


jobs:
  build-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: code check
        uses: actions/checkout@v7 #like plugins in jenkins

      - name: list files
        run: |
          ls -l

      - name: read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: print version
        run: echo " the version is ${{ steps.version.outputs.version }}"
